<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOLECULE — a pharma tycoon simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B1020;
  --slab:#131C33;
  --slab2:#0F1729;
  --edge:#22304F;
  --edge2:#2E4470;
  --foil:#9FB0CE;
  --foil-dim:#69799A;
  --paper:#EEF3FB;
  --mag:#E20177;
  --mag-soft:#FF4FA8;
  --cobalt:#3D7BEF;
  --amber:#F2A93B;
  --mint:#35C4A0;
  --rose:#FF4F6B;
  --r:4px;
  --disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 700px at 78% -10%, rgba(226,1,119,.10), transparent 60%),
    radial-gradient(900px 600px at 5% 105%, rgba(61,123,239,.10), transparent 60%),
    var(--ink);
  color:var(--paper);
  font-family:var(--body);
  font-size:14px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:900;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--foil-dim)}

/* ---------- shell ---------- */
.wrap{max-width:1340px;margin:0 auto;padding:14px 16px 96px}
.topbar{
  display:flex;align-items:stretch;gap:1px;flex-wrap:wrap;
  background:var(--edge);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;
}
.brandcell{background:linear-gradient(160deg,#1A2540,#0E1729);padding:12px 16px;min-width:210px;flex:1 1 210px}
.brandcell .wordmark{font-family:var(--disp);font-weight:900;font-size:19px;letter-spacing:-.02em;line-height:1.05}
.brandcell .tick{font-family:var(--mono);font-size:10px;color:var(--mag-soft);letter-spacing:.14em;margin-top:3px}
.statcell{background:var(--slab2);padding:11px 16px;flex:1 1 120px;min-width:118px}
.statcell .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--foil-dim)}
.statcell .v{font-family:var(--mono);font-size:17px;font-weight:600;margin-top:3px;letter-spacing:-.02em}
.up{color:var(--mint)} .down{color:var(--rose)} .warn{color:var(--amber)}

.grid{display:grid;grid-template-columns:1fr 320px;gap:14px;margin-top:14px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:1fr}}

.panel{background:var(--slab);border:1px solid var(--edge);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--edge)}
.panel-b{padding:14px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:var(--r) var(--r) 0 0;overflow-x:auto}
.tab{
  flex:1;min-width:104px;background:var(--slab2);border:0;padding:11px 12px;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--foil-dim);
  border-bottom:2px solid transparent;transition:color .15s,background .15s;white-space:nowrap
}
.tab:hover{color:var(--paper);background:#16203A}
.tab[aria-selected="true"]{color:var(--paper);background:var(--slab);border-bottom-color:var(--mag)}
.tab .badge{display:inline-block;margin-left:6px;background:var(--mag);color:#fff;border-radius:8px;padding:0 5px;font-size:9px}
.stage{background:var(--slab);border:1px solid var(--edge);border-top:0;border-radius:0 0 var(--r) var(--r);padding:16px;min-height:420px}

/* ---------- signature: blister strip ---------- */
.blister{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  background:linear-gradient(180deg,#C9D4E6 0%, #94A4BE 42%, #B8C4D9 43%, #7D8DA9 100%);
  padding:7px;border-radius:3px;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.35);
}
.blister::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 2px,transparent 2px 7px);border-radius:3px}
.pocket{
  position:relative;height:52px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 32% 26%, rgba(255,255,255,.85), rgba(120,135,160,.25) 62%, rgba(60,70,90,.35));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45), inset 0 4px 8px rgba(0,0,0,.18);
  overflow:hidden
}
.pocket .plab{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:7.5px;letter-spacing:.06em;color:#39445A;text-transform:uppercase}
.cap{width:15px;height:32px;border-radius:9px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.4);transform:rotate(-14deg)}
.cap i{position:absolute;left:0;right:0;height:50%}
.cap i:first-child{top:0;background:var(--mag)}
.cap i:last-child{bottom:0;background:#F4F7FC}
.pocket.done .cap i:first-child{background:var(--mint)}
.pocket.done .cap i:last-child{background:#DFF6EE}
.pocket.active{box-shadow:inset 0 0 0 1.5px var(--mag), inset 0 4px 8px rgba(0,0,0,.18)}
.pocket.active .cap{animation:bob 2.6s ease-in-out infinite}
.pocket.empty .cap{opacity:.16;filter:grayscale(1)}
.pocket.failed{background:linear-gradient(135deg,#8D94A6,#5C6478);filter:grayscale(.6)}
.pocket.failed::before{content:"";position:absolute;inset:0;
  background:linear-gradient(45deg,transparent 46%,rgba(20,25,38,.8) 46% 54%,transparent 54%),
             linear-gradient(-45deg,transparent 46%,rgba(20,25,38,.8) 46% 54%,transparent 54%)}
.pocket.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:rotate(-14deg) translateY(0)}50%{transform:rotate(-14deg) translateY(-3px)}}
.fillbar{position:absolute;left:0;bottom:0;width:100%;background:rgba(226,1,119,.22)}

/* ---------- cards ---------- */
.card{background:var(--slab2);border:1px solid var(--edge);border-radius:var(--r);padding:13px;margin-bottom:12px}
.card.hi{border-color:#3B2B4D;background:linear-gradient(180deg,#161B33,#0F1729)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.title-l{font-family:var(--disp);font-weight:900;font-size:17px;letter-spacing:-.01em}
.chip{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 7px;border-radius:2px;border:1px solid var(--edge);color:var(--foil)}
.chip.mag{border-color:rgba(226,1,119,.5);color:var(--mag-soft);background:rgba(226,1,119,.08)}
.chip.mint{border-color:rgba(53,196,160,.5);color:var(--mint);background:rgba(53,196,160,.08)}
.chip.amber{border-color:rgba(242,169,59,.5);color:var(--amber);background:rgba(242,169,59,.08)}
.chip.rose{border-color:rgba(255,79,107,.5);color:var(--rose);background:rgba(255,79,107,.08)}
.chip.cob{border-color:rgba(61,123,239,.5);color:#7FA9F7;background:rgba(61,123,239,.08)}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px;margin-top:11px}
.metric{background:#0C1426;border:1px solid var(--edge);border-radius:3px;padding:8px 9px}
.metric .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--foil-dim)}
.metric .v{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:2px}

.meter{height:5px;background:#0A1121;border:1px solid var(--edge);border-radius:2px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--cobalt)}
.meter.m i{background:var(--mag)} .meter.g i{background:var(--mint)} .meter.a i{background:var(--amber)}

/* ---------- controls ---------- */
.btn{
  background:var(--slab);border:1px solid var(--edge);border-radius:3px;padding:8px 13px;cursor:pointer;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;transition:.15s
}
.btn:hover{border-color:var(--mag);color:#fff}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--mag);border-color:var(--mag);color:#fff;font-weight:600}
.btn.primary:hover{background:#FF3391;border-color:#FF3391}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:9.5px}
.btn.danger:hover{border-color:var(--rose);color:var(--rose)}
.seg{display:inline-flex;background:#0A1121;border:1px solid var(--edge);border-radius:3px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 11px;cursor:pointer;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--foil-dim)}
.seg button[aria-pressed="true"]{background:var(--mag);color:#fff}
label.fld{display:block;margin-bottom:10px}
label.fld .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--foil-dim);display:block;margin-bottom:5px}
input[type=text],select{
  width:100%;background:#0A1121;border:1px solid var(--edge);border-radius:3px;color:var(--paper);
  padding:9px 10px;font-family:var(--body);font-size:13px
}
input[type=range]{width:100%;accent-color:var(--mag);background:transparent}
input:focus-visible,select:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--mag-soft);outline-offset:2px}

.slider-row{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;margin:9px 0}
.slider-row .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--foil-dim)}
.slider-row .val{font-family:var(--mono);font-size:12px;text-align:right;font-weight:600}

/* ---------- feed ---------- */
.feed{max-height:520px;overflow-y:auto;padding:6px 0}
.ev{display:grid;grid-template-columns:44px 1fr;gap:9px;padding:9px 13px;border-bottom:1px solid rgba(34,48,79,.55)}
.ev .m{font-family:var(--mono);font-size:9.5px;color:var(--foil-dim);padding-top:2px}
.ev .t{font-size:12.5px;line-height:1.45;color:#CBD6EA}
.ev.good{border-left:2px solid var(--mint)} .ev.bad{border-left:2px solid var(--rose)}
.ev.warnl{border-left:2px solid var(--amber)} .ev.info{border-left:2px solid var(--edge)}
.ev b{color:#fff;font-weight:600}
.ev .money{font-family:var(--mono)}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--foil-dim);text-align:right;padding:7px 8px;border-bottom:1px solid var(--edge)}
th:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid rgba(34,48,79,.5);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-family:var(--body)}
tr.tot td{border-top:1px solid var(--edge);border-bottom:0;font-weight:600;color:#fff}

/* ---------- command bar ---------- */
.cmd{position:fixed;left:0;right:0;bottom:0;background:rgba(11,16,32,.93);backdrop-filter:blur(9px);
  border-top:1px solid var(--edge);padding:11px 16px;z-index:40}
.cmd-in{max-width:1340px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cmd .spacer{flex:1}
.burn{font-family:var(--mono);font-size:11px;color:var(--foil-dim)}
.burn b{color:var(--paper)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,7,16,.78);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal{background:var(--slab);border:1px solid var(--edge);border-radius:var(--r);max-width:660px;width:100%;max-height:88vh;overflow-y:auto}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--edge)}
.modal .mb{padding:18px}
.modal .mf{padding:14px 18px;border-top:1px solid var(--edge);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.hidden{display:none!important}
.opt{width:100%;text-align:left;background:#0C1426;border:1px solid var(--edge);border-radius:3px;padding:13px;cursor:pointer;margin-bottom:9px;transition:.15s}
.opt:hover{border-color:var(--mag);background:#111A2F}
.opt .ot{font-family:var(--disp);font-weight:700;font-size:14px;margin-bottom:4px}
.opt .od{font-size:12.5px;color:var(--foil);line-height:1.5}

.muted{color:var(--foil-dim)}
.small{font-size:12px;line-height:1.55;color:var(--foil)}
.hr{height:1px;background:var(--edge);margin:14px 0}
canvas{width:100%;display:block}
.empty{text-align:center;padding:52px 18px;color:var(--foil-dim)}
.empty .big{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--foil);margin-bottom:8px}
.pill-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.pill-legend span{font-family:var(--mono);font-size:9.5px;color:var(--foil-dim);letter-spacing:.08em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brandcell">
      <div class="wordmark" id="coName">MOLECULE</div>
      <div class="tick" id="coTick">A PHARMA TYCOON SIMULATION</div>
    </div>
    <div class="statcell"><div class="k">Cash</div><div class="v" id="sCash">—</div></div>
    <div class="statcell"><div class="k">Net / month</div><div class="v" id="sNet">—</div></div>
    <div class="statcell"><div class="k">Revenue LTM</div><div class="v" id="sRev">—</div></div>
    <div class="statcell"><div class="k">Reputation</div><div class="v" id="sRep">—</div></div>
    <div class="statcell"><div class="k">Enterprise value</div><div class="v" id="sEV">—</div></div>
  </header>

  <div class="grid">
    <!-- MAIN -->
    <main>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="pipeline" aria-selected="true">Pipeline</button>
        <button class="tab" role="tab" data-tab="portfolio" aria-selected="false">Portfolio</button>
        <button class="tab" role="tab" data-tab="commercial" aria-selected="false">Field force</button>
        <button class="tab" role="tab" data-tab="market" aria-selected="false">Market</button>
        <button class="tab" role="tab" data-tab="ledger" aria-selected="false">Ledger</button>
      </div>
      <section class="stage" id="stage"></section>
    </main>

    <!-- RIGHT RAIL -->
    <aside class="panel">
      <div class="panel-h">
        <div>
          <div class="eyebrow">Month feed</div>
          <div class="mono" style="font-size:15px;font-weight:600" id="dateBig">—</div>
        </div>
        <span class="chip" id="quarterChip">—</span>
      </div>
      <div class="feed" id="feed"></div>
    </aside>
  </div>
</div>

<!-- COMMAND BAR -->
<div class="cmd">
  <div class="cmd-in">
    <button class="btn primary" id="btnAdvance">Advance month ▸</button>
    <button class="btn" id="btnAdvance3">▸▸ 3 months</button>
    <span class="burn" id="burnLine"></span>
    <span class="spacer"></span>
    <button class="btn ghost" id="btnBrief">Briefing</button>
    <button class="btn ghost" id="btnSave">Save .sav</button>
    <button class="btn ghost" id="btnLoad">Load .sav</button>
    <button class="btn ghost danger" id="btnNew">New game</button>
    <input type="file" id="fileIn" accept=".sav,.json,application/json" class="hidden">
  </div>
</div>

<!-- MODAL -->
<div class="scrim hidden" id="scrim">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="mh"><div class="eyebrow" id="modalKicker">Decision</div><h2 id="modalTitle" style="font-size:20px;margin-top:4px">—</h2></div>
    <div class="mb" id="modalBody"></div>
    <div class="mf" id="modalFoot"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================================
   1. DOMAIN MODEL — therapeutic areas
   Each area is a different economic game:
   pop        = treatable patients in the addressable market
   refPrice   = reference monthly therapy price (USD)
   elasticity = volume response to your price vs. reference
   trialMult  = cost multiplier on development
   pMod       = multiplier on trial success probability (CNS attrition is real)
   comp       = baseline competitive strength you must out-attract
   excl       = months of market exclusivity from launch
   cogs       = cost of goods as share of gross revenue
   repsNeeded = field force required for full prescriber coverage
   refPromo   = monthly promo spend that meaningfully moves awareness
   ========================================================================= */
const AREAS = {
  cardio:{name:"Cardiometabolic",short:"CARDIO",pop:2600000,refPrice:58,elasticity:1.65,trialMult:1.0,pMod:1.02,comp:0.88,excl:84,cogs:.17,repsNeeded:210,refPromo:2.6e6,refAccess:1.9e6,
    note:"Huge volume, generic-anchored pricing, payers own the outcome. Won on coverage and coverage alone."},
  metab:{name:"Diabetes & Obesity",short:"METAB",pop:1900000,refPrice:215,elasticity:1.25,trialMult:1.7,pMod:0.97,comp:1.02,excl:84,cogs:.21,repsNeeded:190,refPromo:3.4e6,refAccess:2.6e6,
    note:"The most crowded, most capital-intensive fight in the industry. Supply is a strategy, not an ops problem."},
  onco:{name:"Oncology",short:"ONCO",pop:42000,refPrice:9200,elasticity:0.50,trialMult:2.45,pMod:0.90,comp:0.62,excl:96,cogs:.27,repsNeeded:52,refPromo:1.1e6,refAccess:2.2e6,
    note:"Price-insensitive, evidence-hungry. Medical affairs outperforms promotion by a wide margin."},
  immuno:{name:"Immunology",short:"IMMUNO",pop:240000,refPrice:2800,elasticity:0.72,trialMult:2.05,pMod:0.94,comp:0.74,excl:90,cogs:.30,repsNeeded:78,refPromo:2.1e6,refAccess:3.0e6,
    note:"Biologic economics: fat gross margin eaten alive by rebates. Gross-to-net is the whole game."},
  cns:{name:"Neuro & Psychiatry",short:"CNS",pop:780000,refPrice:180,elasticity:1.30,trialMult:1.55,pMod:0.86,comp:0.56,excl:84,cogs:.16,
    repsNeeded:135,refPromo:2.4e6,refAccess:1.7e6,
    note:"Worst clinical attrition in the business. If you survive Phase II, competition is thin."},
  antiinf:{name:"Anti-infectives",short:"ANTI-INF",pop:3400000,refPrice:36,elasticity:2.15,trialMult:0.9,pMod:1.00,comp:1.12,excl:72,cogs:.12,repsNeeded:230,refPromo:1.8e6,refAccess:1.1e6,
    note:"Enormous population, stewardship caps your volume, price collapses on day one of LOE."},
  rare:{name:"Rare disease",short:"RARE",pop:5200,refPrice:24000,elasticity:0.34,trialMult:1.15,pMod:1.06,comp:0.30,excl:108,cogs:.34,repsNeeded:14,refPromo:0.5e6,refAccess:2.4e6,
    note:"Small trials, orphan exclusivity, near-zero competition — and a payer fight for every single patient."},
  vax:{name:"Vaccines",short:"VAX",pop:5000000,refPrice:26,elasticity:1.85,trialMult:1.85,pMod:0.95,comp:0.80,excl:96,cogs:.24,repsNeeded:120,refPromo:3.0e6,refAccess:1.4e6,
    note:"Tender-driven, capacity-driven, politically exposed. You sell to systems, not to prescribers."}
};

const PHASES = [
  {key:"disc",name:"Discovery",abbr:"DISC",months:4, cost:0.55,p:0.80},
  {key:"ph1", name:"Phase I",  abbr:"PH I", months:6, cost:1.00,p:0.78},
  {key:"ph2", name:"Phase II", abbr:"PH II",months:9, cost:2.45,p:0.66},
  {key:"ph3", name:"Phase III",abbr:"PH III",months:13,cost:6.10,p:0.76},
  {key:"reg", name:"Regulatory review",abbr:"REVIEW",months:6,cost:0.75,p:0.90}
];
const COST_UNIT = 4.6e6;

const INTENSITY = {
  lean:{name:"Lean",cost:0.68,time:1.28,p:0.86,desc:"Cheap, slow, riskier. Buys you runway."},
  std :{name:"Standard",cost:1.00,time:1.00,p:1.00,desc:"Textbook protocol design."},
  fast:{name:"Accelerated",cost:1.58,time:0.74,p:1.09,desc:"More sites, more monitors, faster read-out."}
};

const SUFFIX = {
  cardio:["sartan","statin","pril","dipine","zosin"],
  metab:["gliflozin","glutide","gliptin","formin","tazone"],
  onco:["tinib","ciclib","parib","dostat","zomib"],
  immuno:["kinumab","lizumab","cizumab","facitinib","cept"],
  cns:["pridone","zepine","triptan","xetine","zolam"],
  antiinf:["floxacin","cillin","mycin","conazole","vir"],
  rare:["gene","sen","zolgen","ridase","glucase"],
  vax:["vax","vaxia","valent","genix","mune"]
};
const STEM = ["Vel","Zan","Cor","Lyra","Nex","Orav","Talu","Ryn","Ase","Kiva","Mor","Elu","Xan","Bre","Solu","Nyra","Ith","Cava","Duro","Ven","Perl","Ozi","Trev","Hala"];
const MOA = ["selective agonist","allosteric modulator","dual-pathway inhibitor","monoclonal antibody","receptor antagonist","enzyme replacement","antisense oligonucleotide","small-molecule inhibitor","bispecific construct","prodrug formulation"];

/* =========================================================================
   2. STATE
   ========================================================================= */
const SAVE_VERSION = 3;
let G = null;
let TAB = "pipeline";
let popQueue = [];

const rnd = () => Math.random();
const ri = (a,b) => a + Math.floor(rnd()*(b-a+1));
const rf = (a,b) => a + rnd()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const uid = () => Math.random().toString(36).slice(2,9);

function newGame(cfg){
  G = {
    v:SAVE_VERSION, id:uid(),
    co:cfg.co || "Meridian Therapeutics",
    difficulty:cfg.difficulty || "std",
    month:0, horizon:120,
    cash: cfg.difficulty==="hard" ? 140e6 : cfg.difficulty==="easy" ? 300e6 : 210e6,
    debt:0, creditLine:185e6,
    reputation:52, compliance:88,
    reps:14, repsAssigned:{},
    programs:[], products:[], sold:[],
    compDrift:{}, history:[], log:[],
    lastMonth:null, gameOver:null, seedGiven:false
  };
  Object.keys(AREAS).forEach(k => G.compDrift[k]=1);
  // Opening position: one late-stage legacy asset and one early program
  const late = makeProgram(cfg.focus);
  late.phase=3; late.progress=0; late.name=brandName(cfg.focus);
  late.efficacy=clamp(late.efficacy+6,40,97);
  G.programs.push(late);
  const early = makeProgram(cfg.focus);
  early.name=brandName(cfg.focus);
  G.programs.push(early);
  logEv("info","<b>"+G.co+"</b> incorporated. The board expects a marketed brand and a live pipeline within ten years.");
  logEv("info","Legacy asset <b>"+late.name+"</b> ("+AREAS[cfg.focus].name+") is in Phase III. <b>"+early.name+"</b> enters discovery.");
  return G;
}

function brandName(area){
  let n = STEM[ri(0,STEM.length-1)] + SUFFIX[area][ri(0,SUFFIX[area].length-1)];
  n = n[0].toUpperCase()+n.slice(1);
  const taken = [...G? G.programs.map(x=>x.name):[], ...(G?G.products.map(x=>x.name):[])];
  if(taken.includes(n)) n = n + "-" + ri(2,9);
  return n;
}

function makeProgram(area){
  const a = AREAS[area];
  return {
    id:uid(), area, name:"—",
    moa: MOA[ri(0,MOA.length-1)],
    efficacy: Math.round(clamp(rf(46,94)*(a.pMod>1?1.02:0.99),40,97)),
    safety:   Math.round(clamp(rf(48,95),40,98)),
    phase:0, progress:0, intensity:"std",
    spent:0, started:0, dead:false, deadPhase:-1, approved:false
  };
}

function phaseSpec(prog, idx){
  const a = AREAS[prog.area], ph = PHASES[idx], it = INTENSITY[prog.intensity];
  const months = Math.max(2, Math.round(ph.months * it.time));
  const cost = ph.cost * COST_UNIT * a.trialMult * it.cost;
  let p = ph.p * a.pMod * it.p;
  if(ph.key==="ph2") p *= (0.58 + prog.efficacy/125);
  if(ph.key==="ph1"||ph.key==="ph3") p *= (0.62 + prog.safety/135);
  if(ph.key==="reg") p *= (0.70 + (prog.efficacy+prog.safety)/460) * (0.86 + G.reputation/380);
  return {months, cost, monthly:cost/months, p:clamp(p,0.06,0.955)};
}

/* =========================================================================
   3. COMMERCIAL ENGINE
   ========================================================================= */
function launchProduct(prog, price, initialCapacity){
  const a = AREAS[prog.area];
  const prod = {
    id:prog.id, name:prog.name, area:prog.area, moa:prog.moa,
    efficacy:prog.efficacy, safety:prog.safety,
    priceMult: price,
    launched: G.month,
    exclEnd: G.month + a.excl,
    generic:false,
    awareness:0.04, access:0.10, credibility:0.06,
    promo:Math.round(a.refPromo*0.55), medical:Math.round(a.refPromo*0.22), accessSpend:Math.round(a.refAccess*0.4),
    capacity:initialCapacity, capexPending:0,
    patients:0, revLTM:[], peakRev:0, lifetimeRev:0, cogsAdj:0, supplyHit:0
  };
  G.repsAssigned[prod.id] = Math.min(G.reps, Math.round(a.repsNeeded*0.25));
  G.products.push(prod);
  return prod;
}

function productMonth(p, apply){
  const a = AREAS[p.area];
  const age = G.month - p.launched;

  // --- promotional stocks (they decay; you rent attention, you don't own it)
  let A = p.awareness, C = p.access, M = p.credibility;
  if(apply){
    A = A*0.945 + (1-A*0.945)*(1-Math.exp(-p.promo/(a.refPromo*1.25)));
    M = M*0.965 + (1-M*0.965)*(1-Math.exp(-p.medical/(a.refPromo*0.55)));
    const pricePenalty = clamp((p.priceMult-1)*0.22,0,0.45);
    const accessGain = (1-Math.exp(-p.accessSpend/(a.refAccess*1.2))) * (1-pricePenalty);
    C = C*0.982 + (1-C*0.982)*accessGain;
    p.awareness=A; p.credibility=M; p.access=C;
  }

  const reps = G.repsAssigned[p.id]||0;
  const D = 1-Math.exp(-(reps*1.35)/a.repsNeeded);
  const Q = Math.pow((p.efficacy*0.62 + p.safety*0.38)/100, 1.45);
  const mix = 0.31*A + 0.28*D + 0.27*C + 0.14*M;
  const priceEffect = Math.pow(1/Math.max(0.35,p.priceMult), a.elasticity);
  const repFactor = 0.68 + G.reputation/165;
  let attract = Q * mix * priceEffect * repFactor;
  if(p.generic) attract *= 0.20;

  const comp = a.comp * (G.compDrift[p.area]||1);
  const share = attract/(attract+comp);

  const penetration = clamp(0.31 + age*0.005, 0.25, 0.76);
  const demand = a.pop * penetration * share;
  const served = Math.min(demand, p.capacity);
  const unmet = demand - served;

  const realPrice = a.refPrice * p.priceMult * (p.generic ? 0.17 : 1);
  const gross = served * realPrice;
  // Buying access costs rebates. This is the trade every brand manager lives.
  const g2n = clamp(0.09 + 0.26*C + (p.priceMult>1.2?0.05:0), 0.07, 0.42);
  const net = gross*(1-g2n);
  const cogs = net * (a.cogs + p.cogsAdj);

  return {share, demand, served, unmet, net, gross, cogs, g2n, realPrice, A,C,M,D};
}

function estimateDemand(area, efficacy, safety, priceMult){
  const a = AREAS[area];
  const Q = Math.pow((efficacy*0.62 + safety*0.38)/100, 1.45);
  const mix = 0.31*0.86 + 0.28*0.55 + 0.27*0.80 + 0.14*0.80;   // a well-run brand, three years in
  const attract = Q * mix * Math.pow(1/Math.max(0.35,priceMult), a.elasticity);
  const share = attract/(attract + a.comp*1.15);
  return {share, patients: a.pop*0.55*share};
}

function evNPV(){
  let v = G.cash - G.debt;
  G.products.forEach(p=>{
    const r = productMonth(p,false);
    const ann = r.net*12;
    const yearsLeft = Math.max(0,(p.exclEnd-G.month))/12;
    const mult = p.generic ? 0.8 : clamp(1.4 + yearsLeft*0.72, 1.4, 7.2);
    v += ann*mult - (r.cogs*12*mult*0.55);
  });
  G.programs.filter(p=>!p.dead).forEach(p=>{
    const a=AREAS[p.area];
    const stage=[0.06,0.14,0.30,0.62,0.86][p.phase]||0;
    v += a.pop*a.refPrice*0.055*stage*12*0.28;
  });
  return v;
}

/* =========================================================================
   4. MONTH RESOLUTION
   ========================================================================= */
function advance(){
  if(!G || G.gameOver) return;
  const M = {month:G.month, rd:0, sgna:0, promo:0, medical:0, accessS:0, reps:0, capex:0,
             net:0, cogs:0, interest:0, events:[]};
  popQueue = [];

  // --- R&D
  G.programs.forEach(prog=>{
    if(prog.dead || prog.approved) return;
    const spec = phaseSpec(prog, prog.phase);
    M.rd += spec.monthly; prog.spent += spec.monthly;
    prog.progress++;
    if(prog.progress >= spec.months){
      prog.progress = 0;
      if(rnd() < spec.p){
        popQueue.push(prog.id+":"+prog.phase);
        if(prog.phase === PHASES.length-1){
          prog.approved = true;
          logEv("good","<b>"+prog.name+"</b> approved. Regulatory review cleared — launch decision required.");
          G.reputation = clamp(G.reputation+7,0,100);
          queueDecision(launchDecision(prog));
        } else {
          prog.phase++;
          logEv("good","<b>"+prog.name+"</b> cleared "+PHASES[prog.phase-1].name+" → enters "+PHASES[prog.phase].name+".");
          if(PHASES[prog.phase-1].key==="ph2"){
            const d = ri(-4,7); prog.efficacy = clamp(prog.efficacy+d,30,99);
            logEv("info","Phase II read-out for <b>"+prog.name+"</b>: efficacy index revised to "+prog.efficacy+".");
          }
        }
      } else {
        prog.dead = true; prog.deadPhase = prog.phase;
        const lost = prog.spent;
        logEv("bad","<b>"+prog.name+"</b> failed in "+PHASES[prog.phase].name+". <span class='money'>"+money(lost)+"</span> written off.");
        G.reputation = clamp(G.reputation-4,0,100);
      }
    }
  });

  // --- commercial
  let unmetTotal = 0;
  G.products.forEach(p=>{
    if(!p.generic && G.month >= p.exclEnd){
      p.generic = true;
      logEv("bad","Loss of exclusivity: <b>"+p.name+"</b> faces generic entry. Net price collapses.");
    }
    const r = productMonth(p,true);
    p.patients = r.served;
    M.net += r.net; M.cogs += r.cogs;
    M.promo += p.promo; M.medical += p.medical; M.accessS += p.accessSpend;
    p.lifetimeRev += r.net;
    p.revLTM.push(r.net); if(p.revLTM.length>12) p.revLTM.shift();
    p.peakRev = Math.max(p.peakRev, r.net);
    if(r.unmet > r.demand*0.08){
      unmetTotal += r.unmet;
      p.supplyHit++;
      if(p.supplyHit%3===1) logEv("warnl","Supply shortfall on <b>"+p.name+"</b>: "+Math.round(r.unmet).toLocaleString()+" patients unserved. Expand capacity or lose them to the competitor.");
      G.reputation = clamp(G.reputation-1.2,0,100);
    }
    if(p.cogsAdj>0){ p.cogsAdj = Math.max(0, p.cogsAdj-0.008); }
    if(p.capexPending>0){ p.capacity += p.capexPending; p.capexPending=0; }
  });

  // --- fixed costs
  const repCost = G.reps*16500;
  const overhead = 1.05e6 + G.products.length*320000 + G.programs.filter(p=>!p.dead&&!p.approved).length*95000;
  M.reps = repCost; M.sgna = overhead;
  M.interest = G.debt*0.0072;

  const outflow = M.rd+M.promo+M.medical+M.accessS+M.reps+M.sgna+M.cogs+M.interest;
  const profit = M.net - outflow;
  G.cash += profit;

  // --- financing
  if(G.cash < 0){
    const need = -G.cash;
    const room = G.creditLine - G.debt;
    const draw = Math.min(need, room);
    G.debt += draw; G.cash += draw;
    if(draw>0) logEv("warnl","Revolver drawn: <span class='money'>"+money(draw)+"</span>. Outstanding debt <span class='money'>"+money(G.debt)+"</span>.");
    if(G.cash < 0){
      G.gameOver = {type:"bankrupt", month:G.month};
      logEv("bad","<b>Insolvent.</b> The credit line is exhausted and payroll cannot be met.");
    }
  } else if(G.debt>0 && G.cash > 45e6){
    const pay = Math.min(G.debt, G.cash-45e6);
    G.debt -= pay; G.cash -= pay;
  }

  // --- competitive drift: rivals never stand still
  Object.keys(AREAS).forEach(k=>{
    G.compDrift[k] = (G.compDrift[k]||1) * (1 + rf(0.0012,0.0055));
  });

  G.history.push({m:G.month, cash:G.cash, rev:M.net, profit, ev:evNPV(),
    share: G.products.length ? G.products.reduce((s,p)=>s+productMonth(p,false).share,0)/G.products.length : 0});
  if(G.history.length>200) G.history.shift();

  G.lastMonth = {net:M.net, profit, rd:M.rd, promo:M.promo, medical:M.medical, access:M.accessS,
                 reps:M.reps, sgna:M.sgna, cogs:M.cogs, interest:M.interest, outflow};

  rollEvent();
  G.month++;

  if(!G.gameOver && G.month >= G.horizon){
    G.gameOver = {type:"horizon", month:G.month};
  }
  if(G.gameOver) showEndgame();
  else if(pendingDecisions.length) showNextDecision();
  render();
}

/* =========================================================================
   5. EVENTS
   ========================================================================= */
const pendingDecisions = [];
function queueDecision(d){ pendingDecisions.push(d); }

function rollEvent(){
  if(rnd() > 0.34) return;
  const pool = [];
  const prods = G.products.filter(p=>!p.generic);
  const push=(w,f)=>{for(let i=0;i<w;i++) pool.push(f);};

  push(3,()=>{ // competitor launch
    const k = Object.keys(AREAS)[ri(0,7)];
    G.compDrift[k] *= 1.10;
    logEv("warnl","A competitor launched in <b>"+AREAS[k].name+"</b>. Share of voice in that market just got more expensive.");
  });
  if(prods.length) push(3,()=>{ // safety signal
    const p = prods[ri(0,prods.length-1)];
    queueDecision(safetyDecision(p));
  });
  if(prods.length) push(2,()=>{ // payer pressure
    const p = prods[ri(0,prods.length-1)];
    queueDecision(payerDecision(p));
  });
  if(prods.length) push(2,()=>{ // congress
    const p = prods[ri(0,prods.length-1)];
    p.credibility = clamp(p.credibility+0.11,0,1);
    G.reputation = clamp(G.reputation+2,0,100);
    logEv("good","Congress season: your <b>"+p.name+"</b> late-breaker was well received. Prescriber credibility up.");
  });
  push(2,()=>{ // inspection
    if(G.compliance<70){
      const fine = rf(6e6,22e6); G.cash -= fine; G.compliance = clamp(G.compliance+9,0,100);
      logEv("bad","Regulatory inspection found promotional-compliance breaches. Fine of <span class='money'>"+money(fine)+"</span>.");
    } else {
      G.compliance = clamp(G.compliance+3,0,100);
      logEv("info","Routine inspection closed with no findings.");
    }
  });
  if(prods.length) push(2,()=>{ // supply shock
    const p = prods[ri(0,prods.length-1)];
    p.capacity = Math.round(p.capacity*0.72); p.cogsAdj += 0.05;
    logEv("bad","API supplier failure hit <b>"+p.name+"</b>. Capacity down 28%, unit cost up until requalification.");
  });
  if(prods.length) push(1,()=>{ // acquisition offer
    const p = prods[ri(0,prods.length-1)];
    queueDecision(divestDecision(p));
  });
  push(1,()=>{ // patent challenge
    const p = G.products.filter(x=>!x.generic)[0];
    if(!p) return logEv("info","Quiet month. Nothing moved.");
    p.exclEnd -= ri(4,10);
    logEv("warnl","A generic manufacturer filed an early challenge on <b>"+p.name+"</b>. Exclusivity shortened.");
  });
  push(1,()=>{ // talent
    G.reps += ri(-3,4);
    G.reps = Math.max(0,G.reps);
    logEv("info","Field force turnover. Headcount now "+G.reps+" representatives.");
  });
  push(1,()=>{ // grant / partnership
    const cash = rf(8e6,26e6); G.cash += cash;
    logEv("good","Out-licensing deal on an ex-territory right: <span class='money'>"+money(cash)+"</span> upfront received.");
  });

  pool[ri(0,pool.length-1)]();
}

function safetyDecision(p){
  return {
    kicker:"Pharmacovigilance signal",
    title:"Hepatic signal reported on "+p.name,
    body:"Spontaneous reports suggest an elevated rate of liver enzyme elevation. The signal is not confirmed. Medical affairs wants a proactive registry study; commercial wants to wait for causality assessment.",
    options:[
      {t:"Fund a post-authorisation safety study — "+money(9e6),
       d:"Costs cash now, protects the label and your credibility with prescribers.",
       f:()=>{ G.cash-=9e6; p.safety=clamp(p.safety-2,20,99); G.reputation=clamp(G.reputation+3,0,100); p.credibility=clamp(p.credibility+0.06,0,1);
               logEv("info","PASS initiated for <b>"+p.name+"</b>. Label unchanged.");}},
      {t:"Wait for the causality assessment",
       d:"Free today. If the signal confirms, the label warning and the press cycle are worse.",
       f:()=>{ if(rnd()<0.5){ p.safety=clamp(p.safety-11,20,99); G.reputation=clamp(G.reputation-9,0,100); p.awareness=clamp(p.awareness-0.12,0,1);
                 logEv("bad","Signal confirmed on <b>"+p.name+"</b>. Boxed warning added; prescribers are pulling back.");
               } else logEv("good","Causality assessment cleared <b>"+p.name+"</b>. No label change."); }}
    ]
  };
}
function payerDecision(p){
  const reb = Math.round(p.priceMult*100)/100;
  return {
    kicker:"Market access",
    title:"Lead payer demands a deeper rebate on "+p.name,
    body:"The largest institutional buyer will move you to preferred tier — but only at a materially higher rebate. Refuse and you keep price integrity while losing a third of covered lives.",
    options:[
      {t:"Accept the rebate, take the tier",
       d:"Access up sharply. Gross-to-net erodes; every unit is worth less.",
       f:()=>{ p.access=clamp(p.access+0.20,0,1); p.priceMult=Math.max(0.45,p.priceMult*0.90);
               logEv("warnl","Rebate accepted on <b>"+p.name+"</b>. Preferred tier secured at "+(reb!==p.priceMult?"a lower net price":"cost")+".");}},
      {t:"Hold price, lose the tier",
       d:"Protects your reference price across every other negotiation. Volume takes the hit.",
       f:()=>{ p.access=clamp(p.access-0.16,0,1); G.reputation=clamp(G.reputation+1,0,100);
               logEv("info","Price held on <b>"+p.name+"</b>. Coverage narrowed but the reference price stands.");}}
    ]
  };
}
function divestDecision(p){
  const ltm = p.revLTM.reduce((a,b)=>a+b,0);
  const offer = Math.round(ltm*rf(2.6,4.4));
  return {
    kicker:"Corporate development",
    title:"Unsolicited offer for "+p.name,
    body:"A mid-cap acquirer has offered "+money(offer)+" for the full rights. Trailing twelve-month net revenue is "+money(ltm)+".",
    options:[
      {t:"Sell for "+money(offer),
       d:"Cash today, funding for the pipeline, no future upside on this asset.",
       f:()=>{ G.cash+=offer; G.sold.push({name:p.name,offer,month:G.month});
               G.products=G.products.filter(x=>x.id!==p.id); delete G.repsAssigned[p.id];
               logEv("good","<b>"+p.name+"</b> divested for <span class='money'>"+money(offer)+"</span>.");}},
      {t:"Decline",d:"Keep the asset and the cash flows.",f:()=>logEv("info","Offer for <b>"+p.name+"</b> declined.")}
    ]
  };
}
function launchDecision(prog){
  const a = AREAS[prog.area];
  return {kicker:"Launch", title:"Launch "+prog.name+"?", custom:"launch", prog};
}

/* =========================================================================
   6. RENDERING
   ========================================================================= */
const $ = s => document.querySelector(s);
const money = v => {
  const s = v<0?"-":""; v=Math.abs(v);
  if(v>=1e9) return s+"$"+(v/1e9).toFixed(2)+"B";
  if(v>=1e6) return s+"$"+(v/1e6).toFixed(1)+"M";
  if(v>=1e3) return s+"$"+(v/1e3).toFixed(0)+"K";
  return s+"$"+v.toFixed(0);
};
const pct = v => (v*100).toFixed(1)+"%";
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dateOf = m => MONTHS[m%12]+" "+(2027+Math.floor(m/12));

function logEv(kind,text){
  G.log.unshift({m:G.month,kind,text});
  if(G.log.length>160) G.log.pop();
}

function render(){
  if(!G) return;
  $("#coName").textContent = G.co.toUpperCase();
  $("#coTick").textContent = "MONTH "+String(G.month+1).padStart(3,"0")+" / "+G.horizon+"  ·  "+dateOf(G.month).toUpperCase();
  $("#dateBig").textContent = dateOf(G.month);
  $("#quarterChip").textContent = "Q"+(Math.floor((G.month%12)/3)+1)+" FY"+(2027+Math.floor(G.month/12));

  const lm = G.lastMonth;
  $("#sCash").textContent = money(G.cash);
  $("#sCash").className = "v "+(G.cash<20e6?"down":"");
  $("#sNet").textContent = lm ? money(lm.profit) : "—";
  $("#sNet").className = "v "+(lm ? (lm.profit>=0?"up":"down") : "");
  const ltm = G.products.reduce((s,p)=>s+p.revLTM.reduce((a,b)=>a+b,0),0);
  $("#sRev").textContent = money(ltm);
  $("#sRep").textContent = Math.round(G.reputation);
  $("#sRep").className = "v "+(G.reputation<35?"down":G.reputation>68?"up":"");
  $("#sEV").textContent = money(evNPV());

  $("#burnLine").innerHTML = lm
    ? "Last month · net rev <b>"+money(lm.net)+"</b> · spend <b>"+money(lm.outflow)+"</b> · reps <b>"+G.reps+"</b> · debt <b>"+money(G.debt)+"</b>"
    : "Set your R&D and commercial levers, then advance the month.";

  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.tab===TAB)));
  renderFeed();
  ({pipeline:renderPipeline,portfolio:renderPortfolio,commercial:renderCommercial,market:renderMarket,ledger:renderLedger}[TAB])();
}

function renderFeed(){
  const f = $("#feed");
  if(!G.log.length){ f.innerHTML = "<div class='empty'>Nothing has happened yet.</div>"; return; }
  f.innerHTML = G.log.map(e=>
    "<div class='ev "+({good:"good",bad:"bad",warnl:"warnl",info:"info"}[e.kind])+"'>"+
      "<div class='m'>M"+String(e.m+1).padStart(3,"0")+"</div><div class='t'>"+e.text+"</div></div>").join("");
}

/* ---- PIPELINE ---- */
function renderPipeline(){
  const s = $("#stage");
  const live = G.programs.filter(p=>!p.dead && !p.approved);
  let h = "<div class='row' style='margin-bottom:14px'>"+
    "<div><div class='eyebrow'>Research &amp; development</div>"+
    "<h2 style='font-size:22px;margin-top:3px'>Pipeline board</h2></div>"+
    "<button class='btn primary' id='btnNewProg'>+ Start a program</button></div>";

  if(!live.length && !G.programs.some(p=>p.approved))
    h += "<div class='empty'><div class='big'>An empty board is a dying company.</div>"+
         "<div class='small'>Every month without a program in Phase III is a month of your exclusivity clock burning on assets you already own.</div></div>";

  G.programs.forEach(prog=>{
    const a = AREAS[prog.area];
    const spec = prog.dead||prog.approved ? null : phaseSpec(prog, prog.phase);
    h += "<div class='card "+(prog.dead?"":"hi")+"' style='"+(prog.dead?"opacity:.5":"")+"'>";
    h += "<div class='row'><div><div class='title-l'>"+prog.name+"</div>"+
         "<div class='small muted' style='margin-top:2px'>"+prog.moa+" · "+a.name+"</div></div>"+
         "<div style='text-align:right'>"+
           (prog.dead ? "<span class='chip rose'>Terminated in "+PHASES[prog.deadPhase].abbr+"</span>"
            : prog.approved ? "<span class='chip mint'>Approved</span>"
            : "<span class='chip mag'>"+PHASES[prog.phase].name+"</span>")+
         "</div></div>";

    // signature blister strip
    h += "<div class='blister' style='margin-top:12px'>";
    PHASES.forEach((ph,i)=>{
      let cls="pocket";
      if(prog.dead && i===prog.deadPhase) cls+=" failed";
      else if(i<prog.phase || prog.approved) cls+=" done";
      else if(i===prog.phase && !prog.dead) cls+=" active";
      else cls+=" empty";
      const fill = (i===prog.phase && spec) ? Math.round(prog.progress/spec.months*100) : 0;
      h += "<div class='"+cls+"' data-pk='"+prog.id+":"+i+"'>"+
             (fill?"<div class='fillbar' style='height:"+fill+"%'></div>":"")+
             "<div class='cap'><i></i><i></i></div><div class='plab'>"+ph.abbr+"</div></div>";
    });
    h += "</div>";

    if(spec){
      h += "<div class='metrics'>"+
        met("Efficacy index",prog.efficacy)+met("Safety index",prog.safety)+
        met("Success odds",Math.round(spec.p*100)+"%")+
        met("Monthly burn",money(spec.monthly))+
        met("Months left",(spec.months-prog.progress))+
        met("Sunk",money(prog.spent))+"</div>";
      h += "<div class='row' style='margin-top:11px'><div class='eyebrow'>Trial intensity</div>"+
           "<div class='seg' data-int='"+prog.id+"'>"+
             Object.keys(INTENSITY).map(k=>"<button data-k='"+k+"' aria-pressed='"+(prog.intensity===k)+"'>"+INTENSITY[k].name+"</button>").join("")+
           "</div></div>";
      h += "<div class='small muted' style='margin-top:6px'>"+INTENSITY[prog.intensity].desc+" Changing intensity re-scopes the current phase.</div>";
      h += "<div style='margin-top:10px'><button class='btn sm danger' data-kill='"+prog.id+"'>Terminate program</button></div>";
    } else if(prog.approved){
      h += "<div class='small' style='margin-top:10px'>Approved and awaiting a launch decision.</div>"+
           "<button class='btn primary sm' style='margin-top:8px' data-launch='"+prog.id+"'>Open launch plan</button>";
    }
    h += "</div>";
  });
  s.innerHTML = h;
  bindPipeline();
}
const met = (k,v) => "<div class='metric'><div class='k'>"+k+"</div><div class='v'>"+v+"</div></div>";

function bindPipeline(){
  const b = $("#btnNewProg"); if(b) b.onclick = openNewProgram;
  document.querySelectorAll("[data-int]").forEach(seg=>{
    seg.querySelectorAll("button").forEach(btn=>{
      btn.onclick = ()=>{
        const prog = G.programs.find(p=>p.id===seg.dataset.int);
        prog.intensity = btn.dataset.k; prog.progress = 0;
        logEv("info","<b>"+prog.name+"</b> re-scoped to "+INTENSITY[btn.dataset.k].name.toLowerCase()+" protocol. Current phase restarts.");
        render();
      };
    });
  });
  document.querySelectorAll("[data-kill]").forEach(btn=>{
    btn.onclick = ()=>{
      const prog = G.programs.find(p=>p.id===btn.dataset.kill);
      prog.dead=true; prog.deadPhase=prog.phase;
      logEv("warnl","<b>"+prog.name+"</b> terminated by management. "+money(prog.spent)+" written off.");
      render();
    };
  });
  document.querySelectorAll("[data-launch]").forEach(btn=>{
    btn.onclick = ()=>{ const prog=G.programs.find(p=>p.id===btn.dataset.launch); openLaunch(prog); };
  });
  // pop animation for phases advanced this month
  popQueue.forEach(key=>{
    const el = document.querySelector("[data-pk='"+key+"']");
    if(el){ el.classList.add("pop"); setTimeout(()=>el.classList.remove("pop"),600); }
  });
  popQueue = [];
}

function openNewProgram(){
  let sel = "cardio";
  const draw = ()=>{
    const a = AREAS[sel];
    const est = PHASES.reduce((s,p)=>s+p.cost,0)*COST_UNIT*a.trialMult;
    const yrs = PHASES.reduce((s,p)=>s+p.months,0)/12;
    const odds = PHASES.reduce((s,p)=>s*p.p*a.pMod,1);
    modal({
      kicker:"New program", title:"Choose a therapeutic area",
      bodyHTML:
        "<div class='small' style='margin-bottom:12px'>You are not choosing a disease. You are choosing an economic model — patient volume, price ceiling, attrition rate and who actually decides whether your molecule gets used.</div>"+
        "<label class='fld'><span class='k'>Therapeutic area</span><select id='areaSel'>"+
          Object.keys(AREAS).map(k=>"<option value='"+k+"' "+(k===sel?"selected":"")+">"+AREAS[k].name+"</option>").join("")+
        "</select></label>"+
        "<div class='metrics'>"+
          met("Patients",a.pop.toLocaleString())+
          met("Ref. price / mo","$"+a.refPrice.toLocaleString())+
          met("Addressable",money(a.pop*a.refPrice*12*0.55))+
          met("Full program",money(est))+
          met("Discovery→launch",yrs.toFixed(1)+" yr")+
          met("Cumulative odds",(odds*100).toFixed(1)+"%")+
          met("Exclusivity",(a.excl/12).toFixed(0)+" yr")+
          met("Price elasticity",a.elasticity.toFixed(2))+
          met("Reps for coverage",a.repsNeeded)+
        "</div>"+
        "<div class='small' style='margin-top:12px;border-left:2px solid var(--mag);padding-left:11px'>"+a.note+"</div>",
      foot:[
        {t:"Cancel",cls:"btn ghost",f:closeModal},
        {t:"Start discovery — "+money(PHASES[0].cost*COST_UNIT*a.trialMult),cls:"btn primary",f:()=>{
          const p = makeProgram(sel); p.name = brandName(sel); p.started = G.month;
          G.programs.push(p);
          logEv("info","New program <b>"+p.name+"</b> opened in "+AREAS[sel].name+" ("+p.moa+").");
          closeModal(); render();
        }}
      ]
    });
    $("#areaSel").onchange = e=>{ sel = e.target.value; draw(); };
  };
  draw();
}

function openLaunch(prog){
  const a = AREAS[prog.area];
  let priceMult = 1.0;
  let cap = Math.round(a.pop*0.045);
  const capCost = u => u * a.refPrice * 2.4;
  const draw = ()=>{
    const capex = capCost(cap);
    const afford = capex <= G.cash + (G.creditLine-G.debt);
    const est = estimateDemand(prog.area, prog.efficacy, prog.safety, priceMult);
    modal({
      kicker:"Launch plan", title:"Launch "+prog.name,
      bodyHTML:
        "<div class='small' style='margin-bottom:14px'>Two decisions you cannot cleanly reverse: the price you anchor at, and the capacity you build. Everything else is a monthly dial.</div>"+
        "<div class='metrics' style='margin-bottom:14px'>"+
          met("Efficacy",prog.efficacy)+met("Safety",prog.safety)+
          met("Exclusivity",(a.excl/12).toFixed(0)+" yr")+met("Elasticity",a.elasticity.toFixed(2))+
        "</div>"+
        "<div class='slider-row'><div><div class='lab'>Launch price (× reference)</div>"+
          "<input type='range' id='pr' min='40' max='260' value='"+Math.round(priceMult*100)+"'></div>"+
          "<div class='val'>$"+Math.round(a.refPrice*priceMult).toLocaleString()+"<div class='lab' style='text-align:right'>/patient·mo</div></div></div>"+
        "<div class='small muted'>At "+priceMult.toFixed(2)+"× reference, volume response is "+
          (Math.pow(1/priceMult,a.elasticity)*100).toFixed(0)+"% of baseline. Premium pricing also makes formulary access harder to buy.</div>"+
        "<div class='hr'></div>"+
        "<div class='slider-row'><div><div class='lab'>Manufacturing capacity</div>"+
          "<input type='range' id='cp' min='"+Math.round(a.pop*0.005)+"' max='"+Math.round(a.pop*0.16)+"' value='"+cap+"'></div>"+
          "<div class='val'>"+cap.toLocaleString()+"<div class='lab' style='text-align:right'>patients/mo</div></div></div>"+
        "<div class='small muted'>Mature demand at this price is roughly <b>"+Math.round(est.patients).toLocaleString()+"</b> patients per month ("+pct(est.share)+" share). "+
        "You are building for "+(cap/Math.max(1,est.patients)*100).toFixed(0)+"% of it.</div>"+
        "<div class='small muted' style='margin-top:6px'>Capex <b>"+money(capex)+"</b>. Under-build and you hand demand to the competitor; over-build and you sink cash in idle plant.</div>"+
        (afford?"":"<div class='small' style='margin-top:10px;color:var(--rose)'>Available liquidity is "+money(G.cash+(G.creditLine-G.debt))+". Reduce capacity to launch.</div>"),
      foot:[
        {t:"Delay launch",cls:"btn ghost",f:()=>{closeModal(); if(pendingDecisions.length) showNextDecision(); render();}},
        {t: afford ? "Launch — "+money(capex) : "Capex exceeds liquidity",cls: afford?"btn primary":"btn", f:()=>{
          if(!afford) return;
          G.cash -= capex;
          const p = launchProduct(prog, priceMult, cap);
          G.programs = G.programs.filter(x=>x.id!==prog.id);
          logEv("good","<b>"+p.name+"</b> launched at $"+Math.round(a.refPrice*priceMult).toLocaleString()+"/patient·mo with capacity for "+cap.toLocaleString()+" patients.");
          closeModal(); TAB="portfolio"; render();
        }}
      ]
    });
    $("#pr").oninput = e=>{ priceMult = e.target.value/100; draw(); };
    $("#cp").oninput = e=>{ cap = +e.target.value; draw(); };
  };
  draw();
}

function slider(field,id,label,val,min,max){

    "<input type='range' data-f='"+field+"' data-p='"+id+"' min='"+min+"' max='"+max+"' step='"+Math.round((max-min)/60)+"' value='"+val+"'></div>"+

function capacityModal(p){
  const a=AREAS[p.area]; let add = Math.round(a.pop*0.02);
  const cost = u => u*a.refPrice*2.1;
  const draw=()=>{
    modal({kicker:"Manufacturing",title:"Expand capacity for "+p.name,
      bodyHTML:"<div class='small' style='margin-bottom:12px'>Capacity comes online next month. Idle capacity costs you nothing directly — but the cash is gone either way.</div>"+
        "<div class='slider-row'><div><div class='lab'>Additional patients per month</div>"+

        "<div class='small muted'>Capex "+money(cost(add))+" · new total "+(p.capacity+add).toLocaleString()+" patients/mo</div>",
      foot:[{t:"Cancel",cls:"btn ghost",f:closeModal},
            {t:"Commit "+money(cost(add)),cls:"btn primary",f:()=>{
              G.cash -= cost(add); p.capexPending += add;
              logEv("info","Capacity expansion approved for <b>"+p.name+"</b>: +"+add.toLocaleString()+" patients/mo.");
              closeModal(); render();}}]});
    $("#ad").oninput=e=>{add=+e.target.value;draw();};
  }; draw();
}
function priceModal(p){
  const a=AREAS[p.area]; let m=p.priceMult;
  const draw=()=>{
    modal({kicker:"Pricing",title:"Reprice "+p.name,
      bodyHTML:"<div class='small' style='margin-bottom:12px'>Price increases invite payer retaliation and erode access. Price cuts are almost impossible to walk back.</div>"+
        "<div class='slider-row'><div><div class='lab'>Price (× reference)</div>"+
        "<input type='range' id='pm' min='40' max='260' value='"+Math.round(m*100)+"'></div>"+
        "<div class='val'>$"+Math.round(a.refPrice*m).toLocaleString()+"</div></div>"+
        "<div class='small muted'>Volume response "+(Math.pow(1/m,a.elasticity)*100).toFixed(0)+"% of baseline"+
        (m>p.priceMult?" · access penalty on increase":"")+"</div>",
      foot:[{t:"Cancel",cls:"btn ghost",f:closeModal},
            {t:"Apply price",cls:"btn primary",f:()=>{
              if(m>p.priceMult){ p.access=clamp(p.access-0.07*(m/p.priceMult),0,1); G.reputation=clamp(G.reputation-1,0,100); }
              p.priceMult=m;
              logEv("info","<b>"+p.name+"</b> repriced to $"+Math.round(a.refPrice*m).toLocaleString()+"/patient·mo.");
              closeModal(); render();}}]});
    $("#pm").oninput=e=>{m=e.target.value/100;draw();};
  }; draw();
}

    "<div class='pill-legend'><span><i class='dot' style='background:var(--mag)'></i>Cash</span>"+
    "<span><i class='dot' style='background:var(--mint)'></i>Net revenue</span>"+
    "<span><i class='dot' style='background:var(--cobalt)'></i>Enterprise value</span></div></div>"+
    "<canvas id='chart' height='210'></canvas></div>";

  h+="<div class='card'><div class='eyebrow' style='margin-bottom:9px'>Balance</div><div class='metrics'>"+
    met("Cash",money(G.cash))+met("Debt",money(G.debt))+
    met("Revolver room",money(G.creditLine-G.debt))+
    met("Enterprise value",money(evNPV()))+
    met("Reputation",Math.round(G.reputation))+
    met("Compliance",Math.round(G.compliance))+"</div></div>";
  s.innerHTML=h;
  drawChart();
}
const row=(k,v)=>"<tr><td>"+k+"</td><td class='"+(v<0?"muted":"")+"'>"+money(v)+"</td></tr>";

function drawChart(){
  const c=$("#chart"); if(!c) return;
  const dpr=window.devicePixelRatio||1;
  const w=c.clientWidth, hgt=210;
  c.width=w*dpr; c.height=hgt*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  const H=G.history; if(H.length<2){ x.fillStyle="#69799A"; x.font="12px 'IBM Plex Mono'"; x.fillText("Not enough closed periods.",10,26); return; }
  const pad={l:8,r:8,t:12,b:18};
  const series=[{k:"cash",c:"#E20177"},{k:"rev",c:"#35C4A0"},{k:"ev",c:"#3D7BEF"}];
  const all=series.flatMap(s=>H.map(p=>p[s.k]));
  const mn=Math.min(0,...all), mx=Math.max(...all)||1;
  const px=i=>pad.l+(i/(H.length-1))*(w-pad.l-pad.r);
  const py=v=>hgt-pad.b-((v-mn)/(mx-mn))*(hgt-pad.t-pad.b);
  x.strokeStyle="rgba(34,48,79,.85)"; x.lineWidth=1;
  for(let i=0;i<=3;i++){ const yy=pad.t+i*((hgt-pad.t-pad.b)/3); x.beginPath(); x.moveTo(pad.l,yy); x.lineTo(w-pad.r,yy); x.stroke(); }
  if(mn<0){ x.strokeStyle="rgba(255,79,107,.5)"; x.beginPath(); x.moveTo(pad.l,py(0)); x.lineTo(w-pad.r,py(0)); x.stroke(); }
  series.forEach(s=>{
    x.strokeStyle=s.c; x.lineWidth=1.8; x.beginPath();
    H.forEach((p,i)=>{ i?x.lineTo(px(i),py(p[s.k])):x.moveTo(px(i),py(p[s.k])); });
    x.stroke();
  });
  x.fillStyle="#69799A"; x.font="10px 'IBM Plex Mono'";
  x.fillText("M"+(H[0].m+1),pad.l,hgt-5);
  x.fillText("M"+(H[H.length-1].m+1),w-pad.r-32,hgt-5);
}

/* =========================================================================
   7. MODALS
   ========================================================================= */
function modal({kicker,title,bodyHTML,foot}){
  $("#modalKicker").textContent=kicker;
  $("#modalTitle").textContent=title;
  $("#modalBody").innerHTML=bodyHTML;
  const f=$("#modalFoot"); f.innerHTML="";
  (foot||[]).forEach(b=>{
    const el=document.createElement("button"); el.className=b.cls||"btn"; el.textContent=b.t; el.onclick=b.f;
    f.appendChild(el);
  });
  $("#scrim").classList.remove("hidden");
}
function closeModal(){ $("#scrim").classList.add("hidden"); }

function showNextDecision(){
  const d=pendingDecisions.shift(); if(!d) return;
  if(d.custom==="launch"){ openLaunch(d.prog); return; }
  $("#modalKicker").textContent=d.kicker;
  $("#modalTitle").textContent=d.title;
  let b="<div class='small' style='margin-bottom:16px'>"+d.body+"</div>";
  $("#modalBody").innerHTML=b;
  const holder=document.createElement("div");
  d.options.forEach(o=>{
    const btn=document.createElement("button"); btn.className="opt";
    btn.innerHTML="<div class='ot'>"+o.t+"</div><div class='od'>"+o.d+"</div>";
    btn.onclick=()=>{ o.f(); closeModal(); if(pendingDecisions.length) showNextDecision(); render(); };
    holder.appendChild(btn);
  });
  $("#modalBody").appendChild(holder);
  $("#modalFoot").innerHTML="";
  $("#scrim").classList.remove("hidden");
}

function showEndgame(){
  const ev=evNPV();
  const launched=G.products.length+G.sold.length;
  const failed=G.programs.filter(p=>p.dead).length;
  const grade = G.gameOver.type==="bankrupt" ? "INSOLVENT"
    : ev>1.5e9 ? "A · Category leader" : ev>600e6 ? "B · Credible mid-cap"
    : ev>180e6 ? "C · Survived" : "D · Sub-scale";
  modal({
    kicker: G.gameOver.type==="bankrupt" ? "Game over" : "Ten-year review",
    title: grade,
    bodyHTML:"<div class='metrics'>"+
      met("Enterprise value",money(ev))+met("Cash",money(G.cash))+met("Debt",money(G.debt))+
      met("Brands launched",launched)+met("Programs failed",failed)+
      met("Reputation",Math.round(G.reputation))+"</div>"+
      "<div class='hr'></div><div class='small'>"+
      (G.gameOver.type==="bankrupt"
        ? "You ran out of liquidity before a revenue-generating asset reached the market. In this industry the failure mode is almost never a bad molecule — it is a good molecule funded on a timeline the balance sheet could not carry."
        : "Ten years is roughly one full development cycle. Whatever is in your pipeline right now is the company you actually built; the revenue on the P&amp;L was decided by choices you made seven years ago.")+
      "</div>",
    foot:[{t:"Save final .sav",cls:"btn ghost",f:saveGame},{t:"New game",cls:"btn primary",f:()=>{closeModal();openNewGame();}}]
  });
}

function openNewGame(){
  let co="Meridian Therapeutics", focus="cardio", diff="std";
  const draw=()=>{
    modal({kicker:"New company",title:"Found your company",
      bodyHTML:
        "<div class='small' style='margin-bottom:16px'>You have ten years and one balance sheet. Discovery to launch takes about five. Do the arithmetic before you choose your area.</div>"+
        "<label class='fld'><span class='k'>Company name</span><input type='text' id='coIn' value='"+co+"'></label>"+
        "<label class='fld'><span class='k'>Founding therapeutic focus</span><select id='fcIn'>"+
          Object.keys(AREAS).map(k=>"<option value='"+k+"' "+(k===focus?"selected":"")+">"+AREAS[k].name+"</option>").join("")+
        "</select></label>"+
        "<div class='small muted' style='margin-bottom:14px;border-left:2px solid var(--mag);padding-left:11px'>"+AREAS[focus].note+"</div>"+
        "<label class='fld'><span class='k'>Starting capital</span>"+
        "<div class='seg' id='dfIn'>"+
          [["easy","$300M · Well funded"],["std","$210M · Series C"],["hard","$140M · Lean"]]
            .map(([k,l])=>"<button data-k='"+k+"' aria-pressed='"+(k===diff)+"'>"+l+"</button>").join("")+
        "</div></label>",
      foot:[{t:"Found company",cls:"btn primary",f:()=>{
        co=$("#coIn").value.trim()||"Meridian Therapeutics";
        newGame({co,focus,difficulty:diff}); closeModal(); TAB="pipeline"; render();
      }}]});
    $("#fcIn").onchange=e=>{focus=e.target.value;draw();};
    $("#coIn").oninput=e=>{co=e.target.value;};
    $("#dfIn").querySelectorAll("button").forEach(b=>b.onclick=()=>{diff=b.dataset.k;draw();});
  };
  draw();
}

/* =========================================================================
   8. SAVE / LOAD  (.sav file in Downloads)
   ========================================================================= */
function saveGame(){
  if(!G) return;
  const payload = {magic:"MOLECULE-SAV", v:SAVE_VERSION, savedAt:new Date().toISOString(), state:G};
  const blob = new Blob([JSON.stringify(payload,null,1)],{type:"application/octet-stream"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safe = G.co.replace(/[^a-z0-9]+/gi,"-").toLowerCase();
  a.href=url; a.download = safe+"-M"+String(G.month+1).padStart(3,"0")+".sav";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  logEv("info","Progress saved to <b>"+a.download+"</b>.");
  render();
}
function loadGame(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(d.magic!=="MOLECULE-SAV") throw new Error("Not a MOLECULE save file.");
      if(!d.state || typeof d.state.month!=="number") throw new Error("Save file is missing game state.");
      if(d.v!==SAVE_VERSION) console.warn("Save version differs; loading anyway.");
      G = d.state;
      Object.keys(AREAS).forEach(k=>{ if(G.compDrift[k]==null) G.compDrift[k]=1; });
      G.products.forEach(p=>{ if(G.repsAssigned[p.id]==null) G.repsAssigned[p.id]=0; });
      closeModal(); TAB="pipeline"; render();
      logEv("info","Save file loaded. Resuming at "+dateOf(G.month)+".");
      render();
    }catch(err){
      modal({kicker:"Load failed",title:"That file could not be read",
        bodyHTML:"<div class='small'>"+err.message+" Pick a <b>.sav</b> file produced by this game.</div>",
        foot:[{t:"Close",cls:"btn primary",f:closeModal}]});
    }
  };
  r.readAsText(file);
}

   9. WIRING

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{TAB=t.dataset.tab;render();});
$("#btnAdvance").onclick=()=>advance();
$("#btnAdvance3").onclick=()=>{for(let i=0;i<3;i++){ if(!G || G.gameOver) break; if(!$("#scrim").classList.contains("hidden")) break; advance(); }};
$("#btnBrief").onclick=()=>modal({
  kicker:"Briefing", title:"How this company makes money",
  bodyHTML:
   "<div class='small' style='line-height:1.65'>"+
   "<p style='margin:0 0 12px'>One click is one month. You have ten years. Revenue only exists after a molecule survives five phases and you build the plant to supply it.</p>"+
   "<div class='eyebrow' style='margin-bottom:6px'>The pipeline</div>"+
   "<p style='margin:0 0 12px'>Every program burns cash monthly and can die at any phase. Trial intensity trades cash against time and odds — accelerating is not free, and re-scoping restarts the current phase.</p>"+
   "<div class='eyebrow' style='margin-bottom:6px'>The four demand drivers</div>"+
   "<p style='margin:0 0 12px'>Prescriptions come from awareness (promotion), coverage (field force), formulary access (rebates) and credibility (medical affairs). All four decay every month you stop paying for them. None of them substitutes for a weak molecule.</p>"+
   "<div class='eyebrow' style='margin-bottom:6px'>The three tensions</div>"+
   "<p style='margin:0 0 6px'><b>Access costs price.</b> Buying formulary position raises your gross-to-net. Higher access, lower realised price per unit.</p>"+
   "<p style='margin:0 0 6px'><b>Capacity is a bet.</b> Plant takes cash now and comes online next month. Unserved demand goes to the competitor and does not come back.</p>"+
   "<p style='margin:0 0 12px'><b>The clock never stops.</b> Exclusivity is finite and competitive intensity rises every single month, whether or not you act.</p>"+
   "<div class='eyebrow' style='margin-bottom:6px'>Saving</div>"+
   "<p style='margin:0'>Save .sav writes a file to your downloads folder. Load .sav restores it. Nothing is stored in the browser.</p></div>",
  foot:[{t:"Close",cls:"btn primary",f:closeModal}]});
$("#btnSave").onclick=saveGame;
$("#btnLoad").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{ if(e.target.files[0]) loadGame(e.target.files[0]); e.target.value=""; };
$("#btnNew").onclick=()=>{
  modal({kicker:"Confirm",title:"Start a new company?",
    bodyHTML:"<div class='small'>Unsaved progress is lost. Save a .sav first if you want to come back to this run.</div>",
    foot:[{t:"Cancel",cls:"btn ghost",f:closeModal},
          {t:"Save first",cls:"btn ghost",f:saveGame},
          {t:"Start new",cls:"btn primary",f:()=>{closeModal();openNewGame();}}]});
};
window.addEventListener("resize",()=>{ if(TAB==="ledger") drawChart(); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && G && !$("#scrim").classList.contains("hidden") && !pendingDecisions.length) closeModal();
});

openNewGame();
